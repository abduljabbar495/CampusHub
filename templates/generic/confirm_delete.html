{% extends "base.html" %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-6">
  <div class="card shadow-sm border-danger"><div class="card-body">
    <h1 class="h4">Delete this item?</h1>
    <p class="mb-3"><strong>{{ object }}</strong> will be permanently removed.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
