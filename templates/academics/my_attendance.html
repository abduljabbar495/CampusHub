{% extends "base.html" %}
{% block title %}My attendance{% endblock %}
{% block content %}
<h1 class="h3 mb-3">My attendance</h1>
<div class="card shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0">
  <thead class="table-light"><tr><th>Course</th><th>Present</th><th>Classes held</th><th style="width:35%">Attendance</th></tr></thead>
  {% for r in rows %}
  <tr><td>{{ r.course }}</td><td>{{ r.present }}</td><td>{{ r.total }}</td>
    <td><div class="progress"><div class="progress-bar {% if r.pct < 60 %}bg-danger{% elif r.pct < 75 %}bg-warning{% else %}bg-success{% endif %}" style="width: {{ r.pct }}%">{{ r.pct }}%</div></div></td></tr>
  {% empty %}<tr><td colspan="4" class="text-center text-muted py-4">You are not enrolled in any course.</td></tr>{% endfor %}
</table></div></div>
{% endblock %}
