{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Visitor Management</h2><a class="btn btn-primary" href="{% url 'visitor_register' %}">Register visitor</a></div>
<form class="input-group mb-3"><input class="form-control" name="q" value="{{ q }}" placeholder="Search name, phone or pass ID"><button class="btn btn-outline-primary">Search</button></form>
<div class="table-responsive"><table class="table table-striped"><tr><th>Name</th><th>Phone</th><th>Purpose</th><th>Status</th><th>Pass</th></tr>{% for v in visitors %}<tr><td>{{ v.name }}</td><td>{{ v.phone }}</td><td>{{ v.purpose }}</td><td>{{ v.get_status_display }}</td><td><a href="{% url 'visitor_pass' v.pk %}">View pass</a></td></tr>{% empty %}<tr><td colspan="5">No visitor records.</td></tr>{% endfor %}</table></div>{% endblock %}
