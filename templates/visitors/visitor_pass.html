{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="card text-center shadow-sm"><div class="card-body p-4"><h2>CampusHub Visitor Pass</h2><h4>{{ visitor.name }}</h4><p>{{ visitor.phone }} · {{ visitor.department }}</p><p><strong>Purpose:</strong> {{ visitor.purpose }}</p><p><strong>Visiting:</strong> {{ visitor.person_to_visit }}</p><img class="img-fluid border p-2" style="max-width:220px" src="{% url 'visitor_qr' visitor.pk %}" alt="Visitor QR code"><p class="small text-muted mt-2">{{ visitor.pass_id }}</p><a class="btn btn-primary" href="{% url 'visitor_scan' visitor.pass_id %}">Open check-in page</a></div></div></div></div>{% endblock %}
