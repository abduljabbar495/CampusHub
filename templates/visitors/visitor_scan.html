{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body"><h2>{{ visitor.name }}</h2><p>{{ visitor.phone }} · {{ visitor.purpose }}</p><p><strong>Status:</strong> {{ visitor.get_status_display }}</p><form method="post">{% csrf_token %}{% if visitor.status == 'PENDING' %}<button name="action" value="in" class="btn btn-success">Check in</button>{% elif visitor.status == 'CHECKED_IN' %}<button name="action" value="out" class="btn btn-warning">Check out</button>{% else %}<span class="badge text-bg-secondary">Visit completed</span>{% endif %}</form></div></div></div></div>{% endblock %}
