{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="card shadow"><div class="card-body p-4">
    <h1 class="h4 mb-1">Sign in to CampusHub</h1>
    <p class="text-muted">Secure campus management & security platform</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% include "generic/fields.html" %}
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
    <hr>
    <div class="text-center small">New student or teacher? <a href="{% url 'accounts:register' %}">Create an account</a></div>
  </div></div>
</div>
{% endblock %}
